<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark; background:#1A1023">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CheaterFinder — Instagram Activity Tracking</title>

    <!--
      These tags are the defaults baked into the raw HTML, so they are what
      non-JS clients read: social scrapers (Facebook, WhatsApp, X, LinkedIn)
      and AI crawlers never execute JavaScript, and Googlebot reads them before
      it renders. Prerendered marketing pages (script/prerender.ts) overwrite
      the title/description/canonical per route on top of these.
    -->
    <meta name="description" content="Track any public Instagram account with CheaterFinder. See the posts they like, who they follow, and who they unfollow — no Instagram password needed." />
    <link rel="canonical" href="https://cheaterfinder.com/" />

    <meta property="og:site_name" content="CheaterFinder" />
    <meta property="og:title" content="CheaterFinder — Instagram Activity Tracking" />
    <meta property="og:description" content="Track any public Instagram account with CheaterFinder. See the posts they like, who they follow, and who they unfollow — no Instagram password needed." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cheaterfinder.com/" />
    <meta property="og:image" content="https://cheaterfinder.com/opengraph.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="CheaterFinder — Instagram activity tracking dashboard" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CheaterFinder — Instagram Activity Tracking" />
    <meta name="twitter:description" content="Track any public Instagram account with CheaterFinder. See the posts they like, who they follow, and who they unfollow — no Instagram password needed." />
    <meta name="twitter:image" content="https://cheaterfinder.com/opengraph.jpg" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1A1023" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
